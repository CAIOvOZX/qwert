    function showMaterialPickerForSlot(slotIdx) {
      const oldPicker = document.getElementById('materialPicker');
      if (oldPicker) oldPicker.remove();

      const container = document.getElementById('forgeContent');
      const pickerDiv = document.createElement('div');
      pickerDiv.id = 'materialPicker';
      pickerDiv.className = 'material-picker';

      const uniqueMats = [...new Set(state.materials)];
      pickerDiv.innerHTML = '<p>点击材料放入槽位：</p>';

      uniqueMats.forEach(mat => {
        const count = state.materials.filter(m => m === mat).length;
        const matBtn = document.createElement('button');
        matBtn.className = 'material-btn';
        matBtn.textContent = `${mat} (${count})`;
        matBtn.addEventListener('click', () => {
          const idx = state.materials.indexOf(mat);
          if (idx !== -1) {
            state.materials.splice(idx, 1);
            state.forgeSlots[slotIdx] = mat;
            renderForge();
            pickerDiv.remove();
          }
        });
        pickerDiv.appendChild(matBtn);
      });

      container.appendChild(pickerDiv);
    }

    // ==================== 背包界面 ====================
    function renderInventory() {
      const container = document.getElementById('inventoryContent');
      let html = '';

      html += '<h3 style="color:#cdd6f0; margin-bottom:8px;">📦 材料</h3>';
      if (state.materials.length === 0) {
        html += '<p class="hint-text">暂无材料，去副本获取吧。</p>';
      } else {
        const matCount = {};
        state.materials.forEach(m => matCount[m] = (matCount[m] || 0) + 1);
        html += '<div class="inventory-list">';
        for (let [mat, cnt] of Object.entries(matCount)) {
          html += `<div class="inventory-item">${mat} <span style="color:#ffd966;">x${cnt}</span></div>`;
        }
        html += '</div>';
      }

      html += '<div style="display:flex; justify-content:space-between; align-items:center; margin:16px 0 8px;">';
      html += '<h3 style="color:#cdd6f0; margin:0;">⚔️ 装备背包</h3>';
      if (state.forgedEquips.length > 0) {
        html += `<button class="melt-all-btn" id="meltAllBtn">🔥 一键熔炼</button>`;
      }
      html += '</div>';

      if (state.forgedEquips.length === 0) {
        html += '<p class="hint-text">暂无装备，去锻造台合成吧。</p>';
      } else {
        html += '<div class="inventory-list">';
        state.forgedEquips.forEach(eq => {
          const isEquipped = Object.values(state.equipped).some(e => e && e.id === eq.id);
          const quality = getQualityByName(eq.name);
          const slot = EQUIP_SLOTS.find(s => s.id === eq.slot);
          html += `<div class="inventory-item ${isEquipped ? 'equip' : ''} ${quality.className}" data-equip-id="${eq.id}">
            <button class="destroy-btn" data-destroy-id="${eq.id}" title="销毁">✕</button>
            ${slot ? slot.icon : ''} ${eq.name}
            <span style="display:block; font-size:11px; color:${quality.color};">
              ${quality.name} · 攻+${eq.attack} 防+${eq.defense} 血+${eq.health}
            </span>
            ${isEquipped ? '<span class="equip-badge">已装备</span>' : ''}
          </div>`;
        });
        html += '</div>';
      }

      container.innerHTML = html;

      // 点击装备
      container.querySelectorAll('.inventory-item[data-equip-id]').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('destroy-btn')) return;
          const eqId = parseInt(el.dataset.equipId, 10);
          const eq = state.forgedEquips.find(e => e.id === eqId);
          if (!eq) return;

          const isEquipped = Object.values(state.equipped).some(e => e && e.id === eqId);
          if (isEquipped) {
            // 卸下
            for (const slotId of Object.keys(state.equipped)) {
              if (state.equipped[slotId] && state.equipped[slotId].id === eqId) {
                state.equipped[slotId] = null;
                break;
              }
            }
            addScrollEntry(`🔓 卸下 ${eq.name}`);
          } else {
            // 装备
            const slot = EQUIP_SLOTS.find(s => s.id === eq.slot);
            if (state.equipped[eq.slot]) {
              addScrollEntry(`⚠️ ${slot.name}槽位已被占用，请先卸下。`);
              return;
            }
            state.equipped[eq.slot] = eq;
            addScrollEntry(`🗡️ 装备了 ${eq.name}`);
          }
          updateTopStatus();
          renderInventory();
        });
      });

      // 销毁
      container.querySelectorAll('.destroy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const eqId = parseInt(btn.dataset.destroyId, 10);
          const eqIndex = state.forgedEquips.findIndex(e => e.id === eqId);
          if (eqIndex === -1) return;

          const eq = state.forgedEquips[eqIndex];
          // 如果已装备，先卸下
          for (const slotId of Object.keys(state.equipped)) {
            if (state.equipped[slotId] && state.equipped[slotId].id === eqId) {
              state.equipped[slotId] = null;
            }
          }
          state.forgedEquips.splice(eqIndex, 1);

          const returned = Math.random() < CONFIG.DESTROY_RETURN_CHANCE;
          let returnMsg = '';
          if (returned) {
            const match = eq.name.match(/[\d.]+阶/);
            const tier = match ? Math.max(1, Math.round(parseFloat(match[0]))) : 1;
            const returnMat = `材料-${tier}阶`;
            state.materials.push(returnMat);
            returnMsg = `，返还 ${returnMat}`;
          }

          addScrollEntry(`🗑️ 销毁了 ${eq.name}${returnMsg}`);
          updateTopStatus();
          renderInventory();
        });
      });

      // 一键熔炼
      document.getElementById('meltAllBtn')?.addEventListener('click', () => {
        if (state.forgedEquips.length === 0) return;
        const equippedIds = Object.values(state.equipped).filter(e => e).map(e => e.id);
        const toMelt = state.forgedEquips.filter(e => !equippedIds.includes(e.id));

        if (toMelt.length === 0) {
          addScrollEntry('⚠️ 没有可熔炼的装备。');
          return;
        }

        let totalMaterials = 0;
        toMelt.forEach(eq => {
          const match = eq.name.match(/[\d.]+阶/);
          const tier = match ? Math.max(1, Math.round(parseFloat(match[0]))) : 1;
          const returnCount = Math.max(1, Math.floor(tier / 2));
          totalMaterials += returnCount;
          for (let i = 0; i < returnCount; i++) {
            state.materials.push(`材料-${tier}阶`);
          }
        });

        state.forgedEquips = state.forgedEquips.filter(e => equippedIds.includes(e.id));
        addScrollEntry(`🔥 熔炼了 ${toMelt.length} 件装备，获得 ${totalMaterials} 个材料！`, 'victory');
        renderInventory();
      });
    }

    // ==================== 商店界面 ====================
    function renderShop() {
      const container = document.getElementById('shopContent');
      let html = `<div style="color:#9aa6c7; margin-bottom:12px;">💰 当前金币：<span style="color:#ffd966; font-weight:700;">${state.player.gold}</span></div>`;

      SHOP_ITEMS.forEach(item => {
        const canAfford = state.player.gold >= item.price;
        html += `
          <div class="shop-item">
            <div class="shop-item-info">
              <div class="shop-item-name">${item.name}</div>
              <div class="shop-item-desc">${item.desc}</div>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
              <span class="shop-item-price">💰 ${item.price}</span>
              <button class="btn-buy" data-item-id="${item.id}" ${canAfford ? '' : 'disabled'}>购买</button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

      container.querySelectorAll('.btn-buy').forEach(btn => {
        btn.addEventListener('click', () => {
          const itemId = btn.dataset.itemId;
          const item = SHOP_ITEMS.find(i => i.id === itemId);
          if (!item) return;
          if (state.player.gold < item.price) return;

          state.player.gold -= item.price;
          updateTopStatus();

          if (item.type === 'material') {
            state.materials.push(`材料-${item.tier}阶`);
            addScrollEntry(`🏪 购买了 ${item.name}`);
          } else if (item.type === 'consumable') {
            if (item.id === 'potion') {
              const s = getTotalStats();
              state.player.currentHealth = Math.min(s.health, state.player.currentHealth + s.health * 0.3);
              addScrollEntry(`🧪 使用治愈药水，恢复血量。`);
            } else if (item.id === 'rage') {
              addRage(50);
              addScrollEntry(`🧪 使用怒气药剂，获得50怒气。`);
            }
          }
          renderShop();
        });
      });
    }

      document.getElementById('speedSlider')?.addEventListener('input', (e) => {
        state.settings.scrollSpeed = parseInt(e.target.value, 10);
        document.getElementById('speedValue').textContent = state.settings.scrollSpeed + 'ms';

      container.querySelectorAll('[data-action="load"]').forEach(btn => {

          const slotIdx = parseInt(btn.dataset.slotIdx, 10);
          loadGame(slotIdx);
          renderSettings();
        });
      });

    function saveGame(slotIdx) {
      const cls = getClass();
      state.saveSlots[slotIdx] = {
        level: state.player.level.toFixed(1),
        className: cls ? cls.name : '无',
        timestamp: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
        player: JSON.parse(JSON.stringify(state.player)),
        equipped: JSON.parse(JSON.stringify(state.equipped)),
        materials: [...state.materials],
        forgedEquips: JSON.parse(JSON.stringify(state.forgedEquips)),
        stats: JSON.parse(JSON.stringify(state.stats)),
        achievements: [...state.achievements],
        noviceCompleted: state.noviceCompleted,
      };
      addScrollEntry(`💾 游戏已保存到存档 ${slotIdx + 1}`);
    }

    function loadGame(slotIdx) {
      const slot = state.saveSlots[slotIdx];
      if (!slot) return;

      state.player = JSON.parse(JSON.stringify(slot.player));
      state.equipped = JSON.parse(JSON.stringify(slot.equipped));
      state.materials = [...slot.materials];
      state.forgedEquips = JSON.parse(JSON.stringify(slot.forgedEquips));
      state.stats = JSON.parse(JSON.stringify(slot.stats));
      state.achievements = [...slot.achievements];
      state.noviceCompleted = slot.noviceCompleted;

      const cls = getClass();
      document.getElementById('classBadge').textContent = cls ? `${cls.icon} ${cls.name}` : '未选择';
      document.getElementById('playerName').textContent = state.player.name;

      updateTopStatus();
      updateLevelBadge();
      updateExpBar();
      updateRageBar();
      resetScrollArea();
      addScrollEntry(`📂 已读取存档 ${slotIdx + 1}`, 'victory');
    }

      document.getElementById('skill3')?.addEventListener('click', () => {
        if (!state.inCombat) { addScrollEntry('⚠️ 只能在战斗中使用技能。'); return; }
        if (state.player.rage < 30) { addScrollEntry('⚠️ 怒气不足（需要30）。'); return; }
        state.player.rage -= 30;

    // ==================== 初始化 ====================
    function init() {
      const nameCard = document.getElementById('nameCard');
      const nameValue = document.getElementById('playerName');

      nameCard.addEventListener('click', () => {
        if (nameValue.classList.contains('editing')) return;
        nameValue.classList.add('editing');
        nameValue.contentEditable = 'true';
        nameValue.focus();
        const range = document.createRange();
        range.selectNodeContents(nameValue);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      });

      nameValue.addEventListener('blur', () => {
        nameValue.classList.remove('editing');
        nameValue.contentEditable = 'false';
        const newName = nameValue.textContent.trim() || '无名勇士';
        state.player.name = newName;
        nameValue.textContent = newName;
        addScrollEntry(`📝 勇士名称已更改为：${newName}`);
      });

      nameValue.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); nameValue.blur(); }
      });

      document.getElementById('attrBtn').addEventListener('click', () => {
        renderAttrPanel();
        openOverlay('attrOverlay');
      });

      document.getElementById('dungeonBtn').addEventListener('click', () => {
        if (state.isExploring) { addScrollEntry('⚠️ 正在探索中。'); return; }
        renderDungeonList();
        openOverlay('dungeonOverlay');
      });

      document.getElementById('forgeBtn').addEventListener('click', () => {
        if (state.isExploring) { addScrollEntry('⚠️ 正在探索中。'); return; }
        renderForge();
        openOverlay('forgeOverlay');
      });

      document.getElementById('equipBtn').addEventListener('click', () => {
        renderEquip();
        openOverlay('equipOverlay');
      });

      document.getElementById('inventoryBtn').addEventListener('click', () => {
        renderInventory();
        openOverlay('inventoryOverlay');
      });

      document.getElementById('shopBtn').addEventListener('click', () => {
        renderShop();
        openOverlay('shopOverlay');
      });

      document.getElementById('achievementBtn').addEventListener('click', () => {
        renderAchievements();
        openOverlay('achievementOverlay');
      });

      document.getElementById('settingsBtn').addEventListener('click', () => {
        renderSettings();
        openOverlay('settingsOverlay');
      });

      document.querySelectorAll('.close-btn[data-close]').forEach(btn => {
        btn.addEventListener('click', () => closeOverlay(btn.dataset.close));
      });

      setupSkills();
      renderClassSelect();

      updateStepDisplay();
      updateExpBar();
      updateLevelBadge();
      updateTopStatus();
      updateRageBar();
      updateDungeonInfo(null);

      state.materials.push('材料-1阶', '材料-1阶', '材料-2阶', '材料-3阶');
    }

    init();
  })();
</script>
</body>
</html>
